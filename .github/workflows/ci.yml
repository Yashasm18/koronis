name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      # Install the CPU wheel explicitly so the runner does not pull the
      # much larger CUDA build; requirements.txt then finds torch satisfied.
      - name: Install PyTorch (CPU)
        run: pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      # The site-render tests drive the built demo page in a real browser.
      # Without this they skip, which also makes the collected test count
      # differ from a developer machine and trips the badge check.
      - name: Install Chromium for the site tests
        run: python -m playwright install --with-deps chromium

      - name: Build the demo page
        run: python site/build.py

      - name: Run test suite
        run: python -m pytest tests/ -q
